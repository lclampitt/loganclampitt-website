const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const img = new Image();
let dots = [], W = 0, H = 0, mouse = { x: -9999, y: -9999 }, running = false;
let IW = 0, IH = 0, paint = null;

function applyStamp([sx, sy, r, amt]) {
  const x0 = Math.max(0, Math.floor(sx - r)), x1 = Math.min(IW - 1, Math.ceil(sx + r));
  const y0 = Math.max(0, Math.floor(sy - r)), y1 = Math.min(IH - 1, Math.ceil(sy + r));
  const r2 = r * r;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const d2 = (x - sx) * (x - sx) + (y - sy) * (y - sy);
      if (d2 >= r2) continue;
      const f = Math.min(1, 1.6 * (1 - d2 / r2));
      const i = y * IW + x;
      const v = amt * f;
      paint[i] = amt > 0 ? Math.max(paint[i], v) : Math.min(paint[i], v);
    }
  }
}

function buildMask(cols, rows) {
  const m = document.createElement("canvas");
  m.width = cols; m.height = rows;
  const mctx = m.getContext("2d", { willReadFrequently: true });
  const sx = cols / IW, sy = rows / IH;
  mctx.filter = "blur(0.8px)";
  mctx.fillStyle = "#fff";
  mctx.beginPath();
  SILHOUETTE.forEach(([x, y], i) => i ? mctx.lineTo(x * sx, y * sy) : mctx.moveTo(x * sx, y * sy));
  mctx.closePath();
  mctx.fill();
  return mctx.getImageData(0, 0, cols, rows).data;
}

function build() {
  const fit = Math.min(window.innerWidth / IW, window.innerHeight / IH);  // fill the frame, keep photo proportions
  W = Math.floor(IW * fit); H = Math.floor(IH * fit);
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cols = Math.floor(W / SPACING), rows = Math.floor(H / SPACING);
  const off = document.createElement("canvas");
  off.width = cols; off.height = rows;
  const octx = off.getContext("2d", { willReadFrequently: true });
  octx.imageSmoothingQuality = "high";
  octx.drawImage(img, 0, 0, cols, rows);
  const data = octx.getImageData(0, 0, cols, rows).data;
  const mask = buildMask(cols, rows);

  dots = [];
  for (let y = 0; y < rows; y++) {
    const py = Math.min(IH - 1, Math.floor((y + 0.5) / rows * IH));
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const px = Math.min(IW - 1, Math.floor((x + 0.5) / cols * IW));
      const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
      let dark = Math.pow(Math.min(1, Math.max(0, (0.9 - lum) / 0.72)), 1.15) * DOT_STRENGTH;
      dark = Math.max(0, Math.min(1, dark + paint[py * IW + px]));
      dark *= mask[i + 3] / 255;
      const r = MAX_R * Math.sqrt(dark);
      if (r < 0.5) continue;
      const hx = (x + 0.5) * SPACING, hy = (y + 0.5) * SPACING;
      dots.push({ hx, hy, x: hx, y: hy, vx: 0, vy: 0, r });
    }
  }
  kick();
}

function step() {
  let moving = false;
  const R2 = REPEL_R * REPEL_R;
  const released = mouse.x < -1000;
  for (const d of dots) {
    const dx = d.x - mouse.x, dy = d.y - mouse.y;
    const dist2 = dx * dx + dy * dy;
    if (dist2 < R2) {
      const dist = Math.sqrt(dist2) || 0.001;
      const f = (1 - dist / REPEL_R);
      const push = f * f * REPEL_F;
      d.vx += (dx / dist) * push;
      d.vy += (dy / dist) * push;
    }
    d.vx += (d.hx - d.x) * SPRING;
    d.vy += (d.hy - d.y) * SPRING;
    d.vx *= DAMPING; d.vy *= DAMPING;
    d.x += d.vx; d.y += d.vy;
    if (Math.abs(d.vx) > 0.01 || Math.abs(d.vy) > 0.01 ||
        (released && (Math.abs(d.x - d.hx) > 0.05 || Math.abs(d.y - d.hy) > 0.05))) moving = true;
  }
  return moving;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = DOT_COLOR;
  ctx.beginPath();
  for (const d of dots) {
    ctx.moveTo(d.x + d.r, d.y);
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
  }
  ctx.fill();
}

function loop() {
  const moving = step();
  draw();
  if (moving) requestAnimationFrame(loop);
  else running = false;
}
function kick() { if (!running) { running = true; requestAnimationFrame(loop); } }

function setPointer(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
  kick();
}
window.addEventListener("pointermove", setPointer);
window.addEventListener("pointerdown", setPointer);
window.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; kick(); });
document.addEventListener("pointerout", e => { if (!e.relatedTarget) { mouse.x = mouse.y = -9999; kick(); } });
window.addEventListener("pointerup", e => { if (e.pointerType === "touch") { mouse.x = mouse.y = -9999; kick(); } });

window.addEventListener("wheel", e => {
  if (e.ctrlKey || parent === window) return;
  e.preventDefault();
  parent.dispatchEvent(new parent.WheelEvent("wheel", { deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode, bubbles: true, cancelable: true }));
}, { passive: false });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 150); });
img.onload = () => {
  IW = img.naturalWidth; IH = img.naturalHeight;
  paint = new Float32Array(IW * IH);
  PAINT.forEach(applyStamp);
  build();
};
img.src = SRC;
