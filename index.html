<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logan Clampitt | Developer and full stack builder</title>
    <meta
      name="description"
      content="Portfolio of Logan Clampitt, software developer and full stack builder. Open to roles and freelance. Work includes CT Realty Trust, MacroVault, and SoCalDiecasts."
    />
    <meta name="theme-color" content="#faf7f2" />
    <script>
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('logan-theme')
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch (error) {}
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
